[package]
name = "flax"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# Остальные ключи и их описание: https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Суффикс `_lib` может показаться лишним, но он нужен, чтобы имя библиотеки
# было уникальным и не конфликтовало с именем бинарника.
# Похоже, проблема возникает только в Windows, см. https://github.com/rust-lang/cargo/issues/8519
name = "flax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
roxmltree = "0.21.1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
http-serde = "2.1.1"

[profile.dev]
strip = true
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
